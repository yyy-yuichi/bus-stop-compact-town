<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>バス停追加の確認マップ</title>
  </head>
  <body>
    <div id="review-map" aria-label="バス停の比較地図" tabindex="0"></div>
    <header id="review-toolbar">
      <div class="toolbar-row"><a class="home" href="./" aria-label="通常の地図へ戻る">←</a><strong>バス停追加の確認</strong><button id="options" aria-expanded="false" aria-controls="review-options">表示設定</button></div>
      <nav aria-label="表示する地域"><button data-area="hikari" aria-pressed="true">光市</button><button data-area="iwakuni" aria-pressed="false">岩国市</button><button data-area="all" aria-pressed="false">両地域</button></nav>
      <div class="legend"><span><i class="osm-dot"></i>既存OSM</span><span><i class="official-dot"></i>公式・追加候補</span></div>
      <section id="review-options" hidden>
        <label><input type="checkbox" id="show-osm" checked />既存OSM 1,085点</label>
        <label><input type="checkbox" id="show-official" checked />公式候補 907件</label>
        <p>光172件・岩国735件。取得原本は2026年4月時点です。既存点との重複は未統合で、907か所の新設を意味しません。由宇改正関連65件は除いています。</p>
        <p>点をタップすると名称・路線・出典を表示します。徒歩圏の計算はこの確認ページには含めていません。</p>
      </section>
    </header>
    <div id="review-status" role="status">データを読み込んでいます…</div>
    <script type="module" src="/src/review.ts"></script>
  </body>
</html>
