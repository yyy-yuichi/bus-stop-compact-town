name: Publish project to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # 徒歩圏データの配信元。repository variable WALK_DATA_URL に設定する（docs/WALK-DATA-R2.md）。
      # 未設定のまま公開すると徒歩圏が全停留所で404になるため、下で先に落とす。
      VITE_WALK_DATA_URL: ${{ vars.WALK_DATA_URL }}
    steps:
      - name: Require WALK_DATA_URL
        run: |
          if [ -z "$VITE_WALK_DATA_URL" ]; then
            echo "repository variable WALK_DATA_URL が未設定です。公開すると徒歩圏データが取得できません。" >&2
            echo "docs/WALK-DATA-R2.md の手順で R2 に配置し、変数を設定してから再実行してください。" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python3 scripts/test-bake-walking.py
      - run: python3 scripts/bake-walking.py --pilot
      - run: npm run test:walking
      - run: npm run test:baked-walking
      - run: npm run test:stops
      - run: npm run test:places
      - run: python3 scripts/test-walking-source.py
      - run: python3 scripts/test-osm-facilities.py
      - run: npm run build
      - run: node scripts/verify-release.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
